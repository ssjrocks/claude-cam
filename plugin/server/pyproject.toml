[project]
name = "claude-cam"
version = "1.0.0"
description = "Let Claude see through your phone's camera: an MCP server for the Claude Cam Android app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ssjrocks" }]
keywords = ["claude", "mcp", "camera", "android", "claude-code"]
dependencies = [
    "aiohttp>=3.9",
    "pillow>=10",
    "zeroconf>=0.131",
]

[project.urls]
Homepage = "https://github.com/ssjrocks/claude-cam"

[project.scripts]
claude-cam = "claude_cam.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_cam"]
